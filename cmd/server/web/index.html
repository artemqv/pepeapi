<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#132a25">
<title>PepeChat</title>
<style>
:root{color-scheme:light;--ink:#172e28;--muted:#536b61;--line:#dce5de;--paper:#f5f7f2;--white:#fff;--green:#246047;--lime:#d5efab;--dark:#132a25;font-family:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}[hidden]{display:none!important}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #478963;outline-offset:3px}h1,h2,p{margin:0}
.shell{height:100dvh;min-height:340px;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;background:var(--dark);color:white;display:flex;align-items:center;justify-content:space-between;padding:15px clamp(16px,4vw,48px);gap:16px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:-.04em}.logo{width:35px;height:35px;border-radius:11px;background:var(--lime);color:var(--dark);display:grid;place-items:center;font-size:18px}.account{font-size:13px;color:#e1ece3;overflow-wrap:anywhere}
.sidebar{background:#fbfcfa;border-right:1px solid var(--line);padding:25px 16px 16px;display:flex;flex-direction:column;gap:18px;overflow:auto}.sidebar h1{font-size:25px;letter-spacing:-.05em}.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 5px}.btn{border:0;border-radius:10px;background:var(--green);color:white;padding:10px 14px;font-weight:700}.btn:hover{filter:brightness(.92)}.secondary{background:#e6efe7;color:var(--ink)}.chat-list{display:grid;gap:5px}.chat{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;border-radius:13px;background:transparent;padding:11px;text-align:left;color:var(--ink);overflow-wrap:anywhere}.chat:hover,.chat[aria-current=true]{background:#e9f2e8;border-color:#d8e7d8}.avatar{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:13px;background:#dfeeda;color:var(--green);font-weight:800}.note{color:var(--muted);font-size:14px;line-height:1.5;padding:0 5px}
.room{min-width:0;min-height:0;display:flex;flex-direction:column;background-color:#f5f7f2;background-image:radial-gradient(#dce6da 1px,transparent 1px);background-size:22px 22px}.room-head{background:#fbfcfa;border-bottom:1px solid var(--line);padding:16px clamp(16px,4vw,46px);display:flex;align-items:center;gap:10px}.room-head h2{font-size:19px;overflow-wrap:anywhere}.back{display:none}.empty{margin:auto;text-align:center;max-width:350px;padding:24px;display:grid;gap:12px;justify-items:center}.empty .avatar{width:64px;height:64px;border-radius:21px;font-size:28px}.empty h2{font-size:clamp(25px,4vw,35px);letter-spacing:-.055em}.empty p{color:var(--muted);line-height:1.6}
.history{overflow:auto;flex:1;min-height:0;padding:24px clamp(16px,5vw,70px);display:flex;flex-direction:column;gap:12px}.bubble{background:white;border:1px solid var(--line);border-radius:15px 15px 15px 4px;max-width:min(82%,620px);width:fit-content;padding:10px 14px;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#e2f1d5;border-radius:15px 15px 4px 15px}.author{color:var(--green);font-size:12px;font-weight:800;margin-bottom:3px}.body{white-space:pre-wrap;line-height:1.45}.composer{padding:14px clamp(16px,4vw,46px);background:#fbfcfa;border-top:1px solid var(--line)}.compose-row{display:flex;align-items:end;gap:10px}.field{width:100%;min-width:0;background:white;border:1px solid #c9d7ce;border-radius:10px;padding:10px 12px;color:var(--ink)}textarea.field{resize:vertical;min-height:44px;max-height:150px}.error{color:#9a332c;font-size:14px;margin-top:8px}.history>.error{margin:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
dialog{width:min(100% - 32px,420px);border:1px solid var(--line);border-radius:20px;padding:24px;color:var(--ink);box-shadow:0 22px 85px #132a2540}dialog::backdrop{background:#132a2575}dialog h2{font-size:24px;letter-spacing:-.035em}dialog form{display:grid;gap:13px;margin-top:16px}label{display:grid;gap:5px;font-size:14px;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px}.text-btn{border:0;background:none;padding:5px 0;color:var(--green);font-weight:700;text-align:left;width:fit-content}
@media(max-width:650px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{border:0}.room{display:none}.shell[data-chat=true] .sidebar{display:none}.shell[data-chat=true] .room{display:flex}.back{display:inline-block}.top{padding:11px 15px}.sidebar{padding-top:18px}.compose-row .btn{padding-inline:10px}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top"><div class="brand"><span class="logo" aria-hidden="true">P</span>PepeChat</div><span class="account" id="account">Личные сообщения</span></header>
  <aside class="sidebar" aria-label="Список чатов">
    <div class="sidebar-head"><h1>Чаты</h1><button class="btn secondary" id="new-chat" type="button">Новый чат</button></div>
    <p class="note" id="list-note" role="status">Загружаем чаты…</p>
    <nav class="chat-list" id="chats" aria-label="Диалоги"></nav>
  </aside>
  <main class="room">
    <div class="empty" id="welcome"><span class="avatar" aria-hidden="true">✦</span><h2>Открой диалог</h2><p>Выбери чат слева или найди собеседника по имени пользователя.</p><button class="btn" id="welcome-new" type="button">Новый чат</button></div>
    <header class="room-head" id="room-head" hidden><button class="btn secondary back" id="back" type="button" aria-label="Вернуться к чатам">←</button><h2 id="chat-title"></h2></header>
    <section class="history" id="history" aria-label="История сообщений" hidden></section>
    <form class="composer" id="composer" hidden>
      <div class="compose-row"><label class="sr" for="message">Сообщение</label><textarea class="field" id="message" placeholder="Напиши сообщение…" rows="1" required></textarea><button class="btn" id="send" type="submit">Отправить</button></div>
      <p class="error" id="send-error" role="alert" hidden></p>
    </form>
  </main>
</div>
<dialog id="auth-dialog" aria-labelledby="auth-title">
  <h2 id="auth-title">Войти в PepeChat</h2>
  <form id="auth-form">
    <label>Имя пользователя<input class="field" name="username" autocomplete="username" required></label>
    <label id="display-label" hidden>Отображаемое имя<input class="field" name="display_name" autocomplete="nickname" disabled></label>
    <label>Пароль<input class="field" name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="auth-error" role="alert" hidden></p>
    <button class="btn" type="submit" id="auth-submit">Войти</button>
    <button class="text-btn" type="button" id="auth-toggle">Создать аккаунт</button>
  </form>
</dialog>
<dialog id="direct-dialog" aria-labelledby="direct-title">
  <h2 id="direct-title">Новый чат</h2>
  <form id="direct-form">
    <label>Имя собеседника<input class="field" name="username" placeholder="@username" autocapitalize="none" required></label>
    <p class="error" id="direct-error" role="alert" hidden></p>
    <div class="actions"><button class="btn" type="submit">Открыть чат</button><button class="btn secondary" type="button" id="direct-cancel">Отмена</button></div>
  </form>
</dialog>
<script>
'use strict';

const byID = id => document.getElementById(id);
const authDialog = byID('auth-dialog');
const authForm = byID('auth-form');
const directDialog = byID('direct-dialog');
const directForm = byID('direct-form');
const chatList = byID('chats');
const history = byID('history');
const messageInput = byID('message');
const names = new Map();
const drafts = new Map();
let chats = [];
let activeChat = null;
let ownID = null;
let authMode = 'login';
let historyRequest = 0;
let historyKey = '';
let historyLoaded = false;
let sending = false;

function showError(id, message = '') {
  const element = byID(id);
  element.textContent = message;
  element.hidden = !message;
}

async function api(path, body) {
  const options = {credentials: 'same-origin'};
  if (body !== undefined) {
    options.method = 'POST';
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  if (!response.ok) {
    const error = new Error('Запрос завершился ошибкой.');
    error.status = response.status;
    throw error;
  }
  return response.headers.get('content-type')?.includes('application/json') ? response.json() : null;
}

function showAuth() {
  if (directDialog.open) directDialog.close();
  ownID = null;
  names.clear();
  drafts.clear();
  messageInput.value = '';
  chats = [];
  selectChat(null);
  byID('account').textContent = 'Личные сообщения';
  byID('list-note').textContent = 'Войди, чтобы увидеть свои чаты.';
  if (!authDialog.open) authDialog.showModal();
}

function setAuthMode(mode) {
  authMode = mode;
  const registering = mode === 'register';
  byID('auth-title').textContent = registering ? 'Создать аккаунт' : 'Войти в PepeChat';
  byID('auth-submit').textContent = registering ? 'Зарегистрироваться' : 'Войти';
  byID('auth-toggle').textContent = registering ? 'Уже есть аккаунт' : 'Создать аккаунт';
  byID('display-label').hidden = !registering;
  authForm.elements.display_name.disabled = !registering;
  authForm.elements.display_name.required = registering;
  authForm.elements.password.autocomplete = registering ? 'new-password' : 'current-password';
  showError('auth-error');
}

authDialog.addEventListener('cancel', event => event.preventDefault());
byID('auth-toggle').onclick = () => setAuthMode(authMode === 'login' ? 'register' : 'login');
authForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = byID('auth-submit');
  const toggle = byID('auth-toggle');
  const fields = new FormData(authForm);
  const credentials = {username: fields.get('username').trim(), password: fields.get('password')};
  if (!credentials.username) {
    showError('auth-error', 'Введи имя пользователя.');
    return;
  }
  button.disabled = true;
  toggle.disabled = true;
  showError('auth-error');
  try {
    let registered;
    if (authMode === 'register') {
      registered = await api('/register', {...credentials, display_name: fields.get('display_name').trim()});
      setAuthMode('login');
    }
    await api('/login', credentials);
    ownID = registered?.id ?? null;
    byID('account').textContent = '@' + credentials.username;
    authForm.reset();
    authDialog.close();
    await loadChats();
  } catch (error) {
    showError('auth-error', error.status === 401 ? 'Проверь имя пользователя и пароль.' :
      error.status === 409 ? 'Это имя пользователя уже занято.' :
      error.status === 400 ? 'Проверь введённые данные.' : 'Не удалось войти. Попробуй ещё раз.');
  } finally {
    button.disabled = false;
    toggle.disabled = false;
  }
});

function titleFor(id) {
  return names.has(id) ? '@' + names.get(id) : 'Чат #' + id;
}

function renderChats() {
  chatList.replaceChildren();
  for (const chat of chats) {
    const button = document.createElement('button');
    button.className = 'chat';
    button.type = 'button';
    button.setAttribute('aria-current', String(chat.id === activeChat));
    const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.setAttribute('aria-hidden', 'true');
    avatar.textContent = names.get(chat.id)?.[0]?.toUpperCase() || '#';
    const title = document.createElement('span');
    title.textContent = titleFor(chat.id);
    button.append(avatar, title);
    button.onclick = () => selectChat(chat.id);
    chatList.append(button);
  }
}

async function loadChats() {
  const note = byID('list-note');
  note.hidden = false;
  note.textContent = 'Загружаем чаты…';
  try {
    chats = await api('/me/chats') || [];
    note.hidden = chats.length > 0;
    note.textContent = 'Пока нет чатов.';
    renderChats();
  } catch (error) {
    if (error.status === 401) showAuth();
    else note.textContent = 'Не удалось загрузить чаты. Обнови страницу, чтобы повторить.';
  }
}

function selectChat(id) {
  if (activeChat !== null) drafts.set(activeChat, messageInput.value);
  activeChat = id;
  historyRequest++;
  historyKey = '';
  historyLoaded = false;
  messageInput.value = drafts.get(id) || '';
  showError('send-error');
  byID('shell').dataset.chat = String(id !== null);
  byID('welcome').hidden = id !== null;
  for (const element of [byID('room-head'), history, byID('composer')]) element.hidden = id === null;
  renderChats();
  if (id === null) {
    history.replaceChildren();
    return;
  }
  byID('chat-title').textContent = titleFor(id);
  showHistoryNote('Загружаем историю…');
  refreshHistory(id);
}

function showHistoryNote(text) {
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = text;
  history.replaceChildren(note);
}

async function refreshHistory(id) {
  const request = ++historyRequest;
  try {
    const messages = await api('/chats/' + id + '/messages') || [];
    if (activeChat !== id || request !== historyRequest) return;
    const key = JSON.stringify([ownID, messages]);
    if (key === historyKey) return;
    const follow = !historyLoaded || history.scrollHeight - history.scrollTop - history.clientHeight < 72;
    historyKey = key;
    historyLoaded = true;
    if (!messages.length) {
      showHistoryNote('Сообщений пока нет. Начни разговор.');
      return;
    }
    history.replaceChildren();
    const fragment = document.createDocumentFragment();
    for (const message of messages) {
      const bubble = document.createElement('article');
      const mine = message.user_id === ownID;
      bubble.className = mine ? 'bubble mine' : 'bubble';
      const author = document.createElement('p');
      author.className = 'author';
      author.textContent = mine ? 'Ты' : 'Пользователь #' + message.user_id;
      const text = document.createElement('p');
      text.className = 'body';
      text.textContent = message.text;
      bubble.append(author, text);
      fragment.append(bubble);
    }
    history.append(fragment);
    if (follow) history.scrollTop = history.scrollHeight;
  } catch (error) {
    if (activeChat !== id || request !== historyRequest) return;
    if (error.status === 401) showAuth();
    else if (!historyLoaded) showHistoryNote(error.status === 403 ? 'Нет доступа к этому чату.' : 'Не удалось загрузить историю.');
  }
}

function openDirectDialog() {
  if (authDialog.open) return;
  directForm.reset();
  showError('direct-error');
  directDialog.showModal();
}

byID('new-chat').onclick = openDirectDialog;
byID('welcome-new').onclick = openDirectDialog;
byID('direct-cancel').onclick = () => directDialog.close();
byID('back').onclick = () => selectChat(null);
directForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = directForm.querySelector('[type=submit]');
  const username = directForm.elements.username.value.trim().replace(/^@/, '');
  if (!username) {
    showError('direct-error', 'Введи имя собеседника.');
    return;
  }
  button.disabled = true;
  showError('direct-error');
  try {
    const chat = await api('/chats/direct', {username});
    names.set(chat.id, username);
    if (!chats.some(item => item.id === chat.id)) chats.unshift(chat);
    byID('list-note').hidden = true;
    directDialog.close();
    selectChat(chat.id);
  } catch (error) {
    if (error.status === 401) showAuth();
    else showError('direct-error', error.status === 404 ? 'Пользователь не найден.' :
      error.status === 400 ? 'Не удалось открыть диалог. Проверь имя собеседника.' : 'Не удалось открыть диалог. Попробуй ещё раз.');
  } finally {
    button.disabled = false;
  }
});

byID('composer').addEventListener('submit', async event => {
  event.preventDefault();
  const id = activeChat;
  const draft = messageInput.value;
  const text = draft.trim();
  if (id === null || !text || sending) return;
  sending = true;
  byID('send').disabled = true;
  showError('send-error');
  try {
    const saved = await api('/chats/' + id + '/messages', {text});
    ownID = saved.user_id;
    if (activeChat === id && messageInput.value === draft) messageInput.value = '';
    if (drafts.get(id) === draft) drafts.delete(id);
    if (activeChat === id) {
      history.scrollTop = history.scrollHeight;
      await refreshHistory(id);
    }
  } catch (error) {
    if (error.status === 401) showAuth();
    else if (activeChat === id) showError('send-error', error.status === 403 ?
      'Нет доступа к этому чату.' : 'Не удалось отправить сообщение. Попробуй ещё раз.');
  } finally {
    sending = false;
    byID('send').disabled = false;
  }
});

messageInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    byID('composer').requestSubmit();
  }
});

setInterval(() => {
  if (activeChat !== null && !document.hidden && !sending) refreshHistory(activeChat);
}, 4000);
loadChats();
</script>
</body>
</html>
