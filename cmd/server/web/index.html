<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#356689">
<title>PepeChat</title>
<style>
:root {
  color-scheme: light;
  font: 15px/1.45 Inter, system-ui, sans-serif;
  --ink: #193247; --muted: #607687; --blue: #2078af;
  --line: #e3ebf1; --nav: #1c3449; --white: #fff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body, h1, h2, p { margin: 0; }
body { background: #f1f5f8; color: var(--ink); }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: 3px solid #187fc0; outline-offset: 3px; }
.shell {
  display: grid;
  grid-template-columns: 76px minmax(280px, 350px) minmax(0, 1fr);
  height: 100dvh;
  overflow: hidden;
}
.top {
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  gap: 16px; padding: 20px 6px; background: var(--nav); color: #edf7ff;
}
.brand { display: grid; justify-items: center; gap: 7px; font-weight: 750; font-size: 11px; }
.logo, .avatar { display: grid; place-items: center; flex: none; font-weight: 750; }
.logo { width: 44px; height: 44px; border-radius: 50%; background: #409bd5; color: white; font-size: 22px; }
.account { max-width: 100%; overflow-wrap: anywhere; font-size: 11px; text-align: center; color: #c5dcea; }
.sidebar { display: flex; flex-direction: column; min-height: 0; background: white; border-right: 1px solid var(--line); }
.sidebar-head { padding: 20px 18px 14px; }
.sidebar-head h1 { font-size: 24px; letter-spacing: -.04em; }
.sidebar-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
.btn { border: 0; border-radius: 22px; background: var(--blue); color: white; padding: 9px 15px; font-weight: 680; }
.btn:hover:not(:disabled) { filter: brightness(.94); }
.secondary { background: #e8f3fa; color: #225c82; }
.chat-list { flex: 1; min-height: 0; overflow: auto; }
.chat {
  width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px;
  text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 9px 16px;
  background: white; color: var(--ink); font-weight: 650;
}
.chat:hover { background: #f0f7fc; }
.chat[aria-current=true] { background: #2b83bc; color: white; }
.chat span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 43px; height: 43px; border-radius: 50%; color: white; background: #3683b4; }
.chat:nth-child(4n+2) .avatar { background: #6a7db4; }
.chat:nth-child(4n+3) .avatar { background: #387f73; }
.chat:nth-child(4n+4) .avatar { background: #ab674e; }
.note, .sidebar > .error { margin: 10px 18px 14px; }
.note { color: var(--muted); font-size: 14px; }
.room {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: radial-gradient(ellipse at 18% 16%, #c3dbab, transparent 65%),
              radial-gradient(ellipse at 85% 92%, #b4d1a9, transparent 60%), #e6e7b9;
}
.room-head { display: flex; gap: 12px; align-items: center; min-height: 64px; padding: 10px 24px; background: white; border-bottom: 1px solid var(--line); }
.room-head h2 { font-size: 17px; overflow-wrap: anywhere; }
.back { display: none; }
.empty { margin: auto; padding: 24px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.empty h2 { font-size: clamp(23px, 4vw, 34px); letter-spacing: -.04em; }
.empty p { color: #405748; }
.empty .avatar { width: 62px; height: 62px; font-size: 29px; }
.history { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; padding: 22px clamp(14px, 4vw, 52px); }
.history > .note { align-self: center; margin: 8px; padding: 6px 13px; border-radius: 15px; color: #294738; background: #f4fae9; }
.bubble { flex: none; background: white; border-radius: 12px 12px 12px 4px; width: fit-content; max-width: min(82%, 650px); padding: 8px 13px; overflow-wrap: anywhere; box-shadow: 0 1px 2px #33473024; }
.bubble.mine { align-self: flex-end; background: #edfbd8; border-radius: 12px 12px 4px 12px; }
.author { color: #21658b; font-size: 12px; font-weight: 750; }
.body { white-space: pre-wrap; }
.composer { padding: 11px clamp(12px, 3vw, 36px); border-top: 1px solid var(--line); background: white; }
.compose-row { display: flex; align-items: end; gap: 10px; }
.field { width: 100%; min-width: 0; padding: 10px 11px; border: 1px solid #c9d9e4; border-radius: 10px; background: white; color: var(--ink); }
textarea.field { resize: vertical; min-height: 43px; max-height: 140px; }
.error { margin-top: 8px; color: #a23331; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
dialog { width: min(calc(100% - 28px), 450px); max-height: calc(100dvh - 28px); border: 0; border-radius: 18px; padding: clamp(20px, 5vw, 36px); color: var(--ink); box-shadow: 0 18px 65px #172d4733; }
dialog::backdrop { background: #233d59aa; }
dialog h2 { font-size: 24px; letter-spacing: -.035em; }
dialog form { display: grid; gap: 15px; margin-top: 20px; }
label { display: grid; gap: 5px; font-size: 14px; font-weight: 650; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.text-btn { border: 0; background: none; padding: 6px 0; color: var(--blue); font-weight: 700; }
#auth-dialog { text-align: center; }
#auth-dialog label { text-align: left; color: var(--muted); }
#auth-dialog .field { border: 0; border-bottom: 1px solid #aabfce; border-radius: 0; padding-inline: 0; }
.auth-brand { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 17px; color: var(--blue); }
.auth-brand .logo { width: 58px; height: 58px; font-size: 27px; }
.auth-brand .auth-person { background: #cc686d; }
.auth-arrow { font-size: 28px; }
.auth-note { margin-top: 8px; color: var(--muted); }
.auth-actions { justify-content: center; align-items: center; gap: 15px; }
@media (max-width: 680px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .top { flex-direction: row; padding: 10px 16px; background: #356689; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .top .logo { width: 31px; height: 31px; font-size: 15px; }
  .account { font-size: 12px; }
  .sidebar { border: 0; }
  .sidebar-head { padding: 12px 16px; background: #edf5fb; }
  .sidebar-head h1 { font-size: 20px; }
  .sidebar-actions { margin-top: 7px; }
  .room { display: none; }
  .shell[data-chat=true] .sidebar, .shell[data-chat=true] .top { display: none; }
  .shell[data-chat=true] .room { grid-row: 1 / -1; display: flex; }
  .room-head { padding: 8px 12px; }
  .back { display: inline-block; }
  .chat { min-height: 66px; }
}
#group-members { display: flex; flex-wrap: wrap; gap: 7px; list-style: none; margin: 0; padding: 0; }
#group-members button { border: 0; border-radius: 20px; padding: 5px 11px; color: var(--ink); background: #e8f3fa; }
#group-members:empty { display: none; }
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top"><div class="brand"><span class="logo" aria-hidden="true">P</span>PepeChat</div><span class="account" id="account">Личные сообщения</span></header>
  <aside class="sidebar" aria-label="Список чатов">
    <div class="sidebar-head">
      <h1>Чаты</h1>
      <div class="sidebar-actions">
        <button class="btn secondary" id="new-chat" type="button">Личный чат</button>
        <button class="btn" id="create-group" type="button">Создать общий чат</button>
      </div>
    </div>
    <p class="note" id="list-note" role="status">Загружаем чаты…</p>
    <nav class="chat-list" id="chats" aria-label="Диалоги"></nav>
  </aside>
  <main class="room">
    <div class="empty" id="welcome"><span class="avatar" aria-hidden="true">✦</span><h2>Открой диалог</h2><p>Выбери чат в списке или начни личный диалог по @username.</p><button class="btn" id="welcome-new" type="button">Личный чат</button></div>
    <header class="room-head" id="room-head" hidden><button class="btn secondary back" id="back" type="button" aria-label="Вернуться к чатам">←</button><h2 id="chat-title"></h2></header>
    <section class="history" id="history" aria-label="История сообщений" hidden></section>
    <form class="composer" id="composer" hidden>
      <div class="compose-row"><label class="sr" for="message">Сообщение</label><textarea class="field" id="message" placeholder="Напиши сообщение…" rows="1" required></textarea><button class="btn" id="send" type="submit">Отправить</button></div>
      <p class="error" id="send-error" role="alert" hidden></p>
    </form>
  </main>
</div>
<dialog id="auth-dialog" aria-labelledby="auth-title">
  <div class="auth-brand" aria-hidden="true"><span class="logo">P</span><span class="auth-arrow">→</span><span class="logo auth-person">●</span></div>
  <h2 id="auth-title">Войти в PepeChat</h2>
  <p class="auth-note" id="auth-note">Введи имя пользователя и пароль.</p>
  <form id="auth-form">
    <label>Имя пользователя<input class="field" name="username" autocomplete="username" required></label>
    <label id="display-label" hidden>Отображаемое имя<input class="field" name="display_name" autocomplete="nickname" disabled></label>
    <label>Пароль<input class="field" name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="auth-error" role="alert" hidden></p>
    <div class="actions auth-actions">
      <button class="text-btn" type="button" id="auth-toggle">Создать аккаунт</button>
      <button class="btn" type="submit" id="auth-submit">Войти</button>
    </div>
  </form>
</dialog>
<dialog id="direct-dialog" aria-labelledby="direct-title">
  <h2 id="direct-title">Новый чат</h2>
  <form id="direct-form">
    <label>Имя собеседника<input class="field" name="username" placeholder="@username" autocapitalize="none" required></label>
    <p class="error" id="direct-error" role="alert" hidden></p>
    <div class="actions"><button class="btn" type="submit">Открыть чат</button><button class="btn secondary" type="button" id="direct-cancel">Отмена</button></div>
  </form>
</dialog>
<dialog id="group-dialog" aria-labelledby="group-title">
  <h2 id="group-title">Новый общий чат</h2>
  <form id="group-form">
    <label>Название (необязательно)<input class="field" name="title" maxlength="100" placeholder="Например, Команда"></label>
    <label>Участники<input class="field" id="group-user" placeholder="@username" autocapitalize="none" autocomplete="off"></label>
    <button class="btn secondary" type="button" id="group-add">Добавить в список</button>
    <ul id="group-members" aria-label="Выбранные участники"></ul>
    <p class="error" id="group-error" role="alert" hidden></p>
    <div class="actions"><button class="btn" id="group-submit" type="submit">Создать чат</button><button class="btn secondary" id="group-cancel" type="button">Отмена</button></div>
  </form>
</dialog>
<script>
'use strict';

const byID = id => document.getElementById(id);
const authDialog = byID('auth-dialog');
const authForm = byID('auth-form');
const directDialog = byID('direct-dialog');
const directForm = byID('direct-form');
const chatList = byID('chats');
const history = byID('history');
const messageInput = byID('message');
const names = new Map();
const drafts = new Map();
let chats = [];
let activeChat = null;
let ownID = null;
let authMode = 'login';
let historyRequest = 0;
let historyKey = '';
let historyLoaded = false;
let sending = false;

function showError(id, message = '') {
  const element = byID(id);
  element.textContent = message;
  element.hidden = !message;
}

async function api(path, body) {
  const options = {credentials: 'same-origin'};
  if (body !== undefined) {
    options.method = 'POST';
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  if (!response.ok) {
    const error = new Error('Запрос завершился ошибкой.');
    error.status = response.status;
    throw error;
  }
  return response.headers.get('content-type')?.includes('application/json') ? response.json() : null;
}

function showAuth() {
  if (directDialog.open) directDialog.close();
  if (byID('group-dialog').open) byID('group-dialog').close();
  ownID = null;
  names.clear();
  drafts.clear();
  messageInput.value = '';
  chats = [];
  selectChat(null);
  byID('account').textContent = 'Личные сообщения';
  byID('list-note').textContent = 'Войди, чтобы увидеть свои чаты.';
  if (!authDialog.open) authDialog.showModal();
}

function setAuthMode(mode) {
  authMode = mode;
  const registering = mode === 'register';
  byID('auth-title').textContent = registering ? 'Создать аккаунт' : 'Войти в PepeChat';
  byID('auth-note').textContent = registering ? 'Заполни данные нового аккаунта.' : 'Введи имя пользователя и пароль.';
  byID('auth-submit').textContent = registering ? 'Зарегистрироваться' : 'Войти';
  byID('auth-toggle').textContent = registering ? 'Уже есть аккаунт' : 'Создать аккаунт';
  byID('display-label').hidden = !registering;
  authForm.elements.display_name.disabled = !registering;
  authForm.elements.display_name.required = registering;
  authForm.elements.password.autocomplete = registering ? 'new-password' : 'current-password';
  showError('auth-error');
}

authDialog.addEventListener('cancel', event => event.preventDefault());
byID('auth-toggle').onclick = () => setAuthMode(authMode === 'login' ? 'register' : 'login');
authForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = byID('auth-submit');
  const toggle = byID('auth-toggle');
  const fields = new FormData(authForm);
  const credentials = {username: fields.get('username').trim(), password: fields.get('password')};
  if (!credentials.username) {
    showError('auth-error', 'Введи имя пользователя.');
    return;
  }
  button.disabled = true;
  toggle.disabled = true;
  showError('auth-error');
  try {
    let registered;
    if (authMode === 'register') {
      registered = await api('/register', {...credentials, display_name: fields.get('display_name').trim()});
      setAuthMode('login');
    }
    await api('/login', credentials);
    ownID = registered?.id ?? null;
    byID('account').textContent = '@' + credentials.username;
    authForm.reset();
    authDialog.close();
    await loadChats();
  } catch (error) {
    showError('auth-error', error.status === 401 ? 'Проверь имя пользователя и пароль.' :
      error.status === 409 ? 'Это имя пользователя уже занято.' :
      error.status === 400 ? 'Проверь введённые данные.' : 'Не удалось войти. Попробуй ещё раз.');
  } finally {
    button.disabled = false;
    toggle.disabled = false;
  }
});

function titleFor(id) {
  const chat = chats.find(chat => chat.id === id);
  if (chat?.peer_username) return '@' + chat.peer_username;
  if (chat?.title) return chat.title;
  return names.has(id) ? '@' + names.get(id) : 'Чат #' + id;
}

function renderChats() {
  chatList.replaceChildren();
  for (const chat of chats) {
    const button = document.createElement('button');
    button.className = 'chat';
    button.type = 'button';
    button.setAttribute('aria-current', String(chat.id === activeChat));
    const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.setAttribute('aria-hidden', 'true');
    avatar.textContent = (chat.peer_username || names.get(chat.id) || chat.title)?.[0]?.toUpperCase() || '#';
    const title = document.createElement('span');
    title.textContent = titleFor(chat.id);
    button.append(avatar, title);
    button.onclick = () => selectChat(chat.id);
    chatList.append(button);
  }
}

async function loadChats() {
  const note = byID('list-note');
  note.hidden = false;
  note.textContent = 'Загружаем чаты…';
  try {
    chats = await api('/me/chats') || [];
    note.hidden = chats.length > 0;
    note.textContent = 'Пока нет чатов.';
    renderChats();
  } catch (error) {
    if (error.status === 401) showAuth();
    else note.textContent = 'Не удалось загрузить чаты. Обнови страницу, чтобы повторить.';
  }
}

function selectChat(id) {
  if (activeChat !== null) drafts.set(activeChat, messageInput.value);
  activeChat = id;
  historyRequest++;
  historyKey = '';
  historyLoaded = false;
  messageInput.value = drafts.get(id) || '';
  showError('send-error');
  byID('shell').dataset.chat = String(id !== null);
  byID('welcome').hidden = id !== null;
  for (const element of [byID('room-head'), history, byID('composer')]) element.hidden = id === null;
  renderChats();
  if (id === null) {
    history.replaceChildren();
    return;
  }
  byID('chat-title').textContent = titleFor(id);
  showHistoryNote('Загружаем историю…');
  refreshHistory(id);
}

function showHistoryNote(text) {
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = text;
  history.replaceChildren(note);
}

async function refreshHistory(id) {
  const request = ++historyRequest;
  try {
    const messages = await api('/chats/' + id + '/messages') || [];
    if (activeChat !== id || request !== historyRequest) return;
    const key = JSON.stringify([ownID, messages]);
    if (key === historyKey) return;
    const follow = !historyLoaded || history.scrollHeight - history.scrollTop - history.clientHeight < 72;
    historyKey = key;
    historyLoaded = true;
    if (!messages.length) {
      showHistoryNote('Сообщений пока нет. Начни разговор.');
      return;
    }
    history.replaceChildren();
    const fragment = document.createDocumentFragment();
    for (const message of messages) {
      const bubble = document.createElement('article');
      const mine = message.user_id === ownID;
      bubble.className = mine ? 'bubble mine' : 'bubble';
      const author = document.createElement('p');
      author.className = 'author';
      author.textContent = mine ? 'Ты' : message.author_name || 'Участник';
      const text = document.createElement('p');
      text.className = 'body';
      text.textContent = message.text;
      bubble.append(author, text);
      fragment.append(bubble);
    }
    history.append(fragment);
    if (follow) history.scrollTop = history.scrollHeight;
  } catch (error) {
    if (activeChat !== id || request !== historyRequest) return;
    if (error.status === 401) showAuth();
    else if (!historyLoaded) showHistoryNote(error.status === 403 ? 'Нет доступа к этому чату.' : 'Не удалось загрузить историю.');
  }
}

function openDirectDialog() {
  if (authDialog.open) return;
  directForm.reset();
  showError('direct-error');
  directDialog.showModal();
}

const groupDialog = byID('group-dialog');
const groupForm = byID('group-form');
const groupUser = byID('group-user');
const groupMembers = new Set();

function renderGroupMembers() {
  byID('group-members').replaceChildren(...Array.from(groupMembers, username => {
    const item = document.createElement('li');
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '@' + username + ' ×';
    remove.setAttribute('aria-label', 'Убрать @' + username + ' из списка');
    remove.onclick = () => {
      groupMembers.delete(username);
      renderGroupMembers();
      groupUser.focus();
    };
    item.append(remove);
    return item;
  }));
}

function addGroupMember() {
  const username = groupUser.value.trim().replace(/^@/, '');
  if (!username || /[\s@]/.test(username)) {
    showError('group-error', 'Введи одно имя пользователя, например @petya.');
    return false;
  }
  groupMembers.add(username);
  groupUser.value = '';
  showError('group-error');
  renderGroupMembers();
  return true;
}

byID('create-group').onclick = () => {
  groupForm.reset();
  groupMembers.clear();
  renderGroupMembers();
  showError('group-error');
  groupDialog.showModal();
};
byID('group-add').onclick = () => {
  addGroupMember();
  groupUser.focus();
};
groupUser.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.isComposing) {
    event.preventDefault();
    addGroupMember();
  }
});
byID('group-cancel').onclick = () => groupDialog.close();
groupDialog.addEventListener('cancel', event => {
  if (byID('group-submit').disabled) event.preventDefault();
});
groupForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = byID('group-submit');
  if (button.disabled || (groupUser.value.trim() && !addGroupMember())) return;
  const title = groupForm.elements.title.value.trim();
  const member_usernames = Array.from(groupMembers);
  const hasDetails = Boolean(title || member_usernames.length);
  const controls = Array.from(groupForm.elements);
  controls.forEach(control => { control.disabled = true; });
  showError('group-error');
  try {
    const chat = await api(hasDetails ? '/chats/group' : '/chats',
      hasDetails ? {title, member_usernames} : {});
    chats.unshift(chat);
    byID('list-note').hidden = true;
    groupDialog.close();
    selectChat(chat.id);
  } catch (error) {
    if (error.status === 401) showAuth();
    else showError('group-error', hasDetails && (error.status === 405 || error.status === 501)
      ? 'Сервер пока не поддерживает создание чата с названием или участниками.'
      : error.status === 404 ? 'Не удалось найти участника или маршрут создания чата.'
      : 'Не удалось создать общий чат. Проверь данные и попробуй ещё раз.');
  } finally {
    controls.forEach(control => { control.disabled = false; });
  }
});

byID('new-chat').onclick = openDirectDialog;
byID('welcome-new').onclick = openDirectDialog;
byID('direct-cancel').onclick = () => directDialog.close();
byID('back').onclick = () => selectChat(null);
directForm.addEventListener('submit', async event => {
  event.preventDefault();
  const button = directForm.querySelector('[type=submit]');
  const username = directForm.elements.username.value.trim().replace(/^@/, '');
  if (!username) {
    showError('direct-error', 'Введи имя собеседника.');
    return;
  }
  button.disabled = true;
  showError('direct-error');
  try {
    const chat = await api('/chats/direct', {username});
    names.set(chat.id, username);
    if (!chats.some(item => item.id === chat.id)) chats.unshift(chat);
    byID('list-note').hidden = true;
    directDialog.close();
    selectChat(chat.id);
  } catch (error) {
    if (error.status === 401) showAuth();
    else showError('direct-error', error.status === 404 ? 'Пользователь не найден.' :
      error.status === 400 ? 'Не удалось открыть диалог. Проверь имя собеседника.' : 'Не удалось открыть диалог. Попробуй ещё раз.');
  } finally {
    button.disabled = false;
  }
});

byID('composer').addEventListener('submit', async event => {
  event.preventDefault();
  const id = activeChat;
  const draft = messageInput.value;
  const text = draft.trim();
  if (id === null || !text || sending) return;
  sending = true;
  byID('send').disabled = true;
  showError('send-error');
  try {
    const saved = await api('/chats/' + id + '/messages', {text});
    ownID = saved.user_id;
    if (activeChat === id && messageInput.value === draft) messageInput.value = '';
    if (drafts.get(id) === draft) drafts.delete(id);
    if (activeChat === id) {
      history.scrollTop = history.scrollHeight;
      await refreshHistory(id);
    }
  } catch (error) {
    if (error.status === 401) showAuth();
    else if (activeChat === id) showError('send-error', error.status === 403 ?
      'Нет доступа к этому чату.' : 'Не удалось отправить сообщение. Попробуй ещё раз.');
  } finally {
    sending = false;
    byID('send').disabled = false;
  }
});

messageInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    byID('composer').requestSubmit();
  }
});

setInterval(() => {
  if (activeChat !== null && !document.hidden && !sending) refreshHistory(activeChat);
}, 4000);
loadChats();
</script>
</body>
</html>
